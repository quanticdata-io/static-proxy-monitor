[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "static-proxy-monitor"
version = "0.1.0"
description = "Check static ISP and datacenter proxies: exit IP identity, whether geolocation databases agree, target sites, and what changed since the last run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["isp-proxy", "static-residential-proxy", "proxy-monitoring", "ip-geolocation", "proxy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.27,<1"]

[project.scripts]
static-proxy-monitor = "static_proxy_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/quanticdata-io/static-proxy-monitor"
Documentation = "https://github.com/quanticdata-io/static-proxy-monitor#readme"
Issues = "https://github.com/quanticdata-io/static-proxy-monitor/issues"
Changelog = "https://github.com/quanticdata-io/static-proxy-monitor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/static_proxy_monitor"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "C4", "RET"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0911", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
